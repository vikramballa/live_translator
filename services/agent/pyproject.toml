[project]
name = "agent"
version = "0.1.0"
description = "Translator agent: joins a LiveKit room and translates speech between the two participants."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pipeline-core",
  # media
  "livekit>=1.0",
  "livekit-api>=1.0",
  "aiohttp>=3.10",
  # inference
  "numpy>=1.26,<3",
  "onnxruntime>=1.20",
  "onnx>=1.17",  # build-time: int8 quantisation in `translator-cli download`
  "onnx-asr>=0.7",
  "faster-whisper>=1.1",
  "torch>=2.5",
  # IndicTrans2's remote code targets transformers 4.x
  "transformers>=4.51,<5",
  "sentencepiece>=0.2",
  "pyyaml>=6",
  "IndicTransToolkit>=1.0",
  "huggingface-hub>=0.26",
  "soxr>=0.5",
  "mlx-whisper>=0.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[project.scripts]
translator-agent = "agent.main:main"
translator-cli = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
