[project]
name = "pipeline-core"
version = "0.1.0"
description = "Pure, I/O-free algorithms for the live translator: endpointing, number handling, key facts, quality checks, TTS text normalisation."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_core"]
